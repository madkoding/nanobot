repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: sync-versions
        name: sync webui/package.json version to pyproject.toml
        entry: python scripts/sync_versions.py --check
        language: system
        files: ^(pyproject\.toml|webui/package\.json)$
        pass_filenames: false
      - id: version-change-only-on-develop
        name: enforce version bumps originate on develop
        entry: python scripts/check_version_branch.py
        language: system
        files: ^(pyproject\.toml|webui/package\.json)$
        pass_filenames: false
