name: Release

# develop is the single source of truth for version numbers. A release is a
# propagation: merge develop -> main, then this workflow reads the version
# that develop already bumped (never recomputes it) and publishes that exact
# tag as a GitHub Release.
#
# To bump: on develop, run `python scripts/bump_version.py patch|minor|major`.
# To release: merge develop into main. CI guards both directions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged; nothing to release."
            exit 0
          fi

          # Changelog body from the commits since the last tag.
          last_tag="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            body="$(git log "$last_tag..HEAD" --pretty='format:- %s' --no-merges)"
          else
            body=""
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "## $VERSION${body:+$'\n\n'$body}" \
            --target main
